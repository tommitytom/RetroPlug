name: build

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The dpf.js submodule (and its nested submodules) use SSH URLs; the
          # runner has no SSH key. Init them ourselves after rewriting to HTTPS.
          submodules: false

      - name: Init submodules (rewrite SSH -> HTTPS; all repos are public)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends \
            cmake ninja-build pkg-config \
            libgl-dev libglu1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxext-dev libxinerama-dev \
            libdbus-1-dev libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libffi-dev libssl-dev \
            libsdl2-dev \
            xvfb

      - name: Install RGBDS (boot-ROM assembler)
        run: |
          set -eux
          tmp="$(mktemp -d)"; cd "$tmp"
          curl -fsSL "https://github.com/gbdev/rgbds/releases/download/v1.0.1/rgbds-linux-x86_64.tar.xz" -o rgbds.tar.xz
          tar -xJf rgbds.tar.xz
          sudo install -m 0755 rgbasm rgblink rgbgfx rgbfix /usr/local/bin/
          rgbasm --version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install workspace deps (pnpm)
        run: |
          pnpm install --frozen-lockfile
          # The UI bundle's react/react-reconciler/lvgljs-ui live in
          # lv_binding_js's own workspace (deps/ is excluded from the root
          # workspace), so it needs its own install (see AGENTS.md).
          pnpm install --frozen-lockfile -C deps/dpf.js/deps/lv_binding_js

      - name: Build
        run: ./build.sh

      - name: TS tests
        run: pnpm test

      - name: Native tests (real host + emulator cores)
        run: pnpm test:native

      - name: Plugin unit tests (Catch2)
        run: pnpm test:plugin

      - name: UI tests (headless LVGL)
        run: pnpm test:ui

      - name: Install plugin-format validators
        run: |
          set -eux
          tmp="$(mktemp -d)"
          cd "$tmp"
          curl -fsSL "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip" -o pv.zip
          unzip -q pv.zip
          sudo install -m 0755 pluginval /usr/local/bin/pluginval
          curl -fsSL "https://github.com/free-audio/clap-validator/releases/download/0.3.2/clap-validator-0.3.2-ubuntu-18.04.tar.gz" -o cv.tgz
          tar -xzf cv.tgz
          sudo install -m 0755 clap-validator /usr/local/bin/clap-validator
          pluginval --version
          clap-validator --version

      - name: Validate plugins
        run: xvfb-run -a pnpm validate

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retroplug-linux-x86_64
          if-no-files-found: warn
          path: |
            build/bin/retroplug
            build/bin/retroplug-cli
            build/bin/retroplug.clap
            build/bin/retroplug.vst3
            build/bin/retroplug-vst2.so

  windows:
    # windows-2025 (MSVC 14.4x newer toolset). windows-2022's 14.44 miscompiles
    # the Mesen core — the NES PPU publishes no frame, failing the native suite —
    # while 14.51 locally + Linux/macOS render fine.
    runs-on: windows-2025
    env:
      # build.bat defaults VCPKG_ROOT to C:\code\vcpkg; point it at the runner's
      # preinstalled vcpkg. RGBDS_DIR is set later once RGBDS is extracted.
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules (rewrite SSH -> HTTPS; all repos are public)
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install workspace deps (pnpm)
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm install --frozen-lockfile -C deps/dpf.js/deps/lv_binding_js

      - name: Install RGBDS (boot-ROM assembler)
        shell: pwsh
        run: |
          $ver = "v1.0.1"
          Invoke-WebRequest "https://github.com/gbdev/rgbds/releases/download/$ver/rgbds-win64.zip" -OutFile rgbds.zip
          Expand-Archive rgbds.zip -DestinationPath "$env:RUNNER_TEMP\rgbds"
          # build.bat prepends %RGBDS_DIR% to PATH so find_program locates rgbasm/rgblink/rgbgfx.
          "RGBDS_DIR=$env:RUNNER_TEMP\rgbds" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          # Include the runner image: static libs built with one MSVC toolset
          # shouldn't be restored onto a different one.
          key: vcpkg-x64-windows-static-sdl2-libffi-windows-2025

      - name: Install vcpkg dependencies (x64-windows-static)
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install sdl2:x64-windows-static libffi:x64-windows-static

      - name: Build
        shell: cmd
        run: build.bat

      # test.bat enters the MSVC env itself (GitHub Actions does not persist the
      # env build.bat set up into later steps) and runs the suites via pnpm.
      - name: Test suites (ts / native / plugin / ui)
        shell: cmd
        run: test.bat

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retroplug-windows-x86_64
          if-no-files-found: warn
          path: |
            build/bin/retroplug.exe
            build/bin/retroplug-cli.exe
            build/bin/retroplug.clap
            build/bin/retroplug.vst3
            build/bin/retroplug-vst2.dll

  # Native arm64 build check (proven green). Universal + codesign/notarization
  # and the AU target are future work.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules (rewrite SSH -> HTTPS; all repos are public)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install build dependencies (Homebrew)
        run: |
          brew install ninja pkg-config sdl2 libffi rgbds
          # Homebrew's keg-only libffi needs its pkg-config on the path.
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install workspace deps (pnpm)
        run: |
          pnpm install --frozen-lockfile
          pnpm install --frozen-lockfile -C deps/dpf.js/deps/lv_binding_js

      - name: Build
        run: ./build.sh

      - name: TS tests
        run: pnpm test

      - name: Native tests (real host + emulator cores)
        run: pnpm test:native

      - name: Plugin unit tests (Catch2)
        run: pnpm test:plugin

      - name: UI tests (headless LVGL)
        run: pnpm test:ui

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retroplug-macos-arm64
          if-no-files-found: warn
          path: |
            build/bin/retroplug
            build/bin/retroplug-cli
            build/bin/retroplug.clap
            build/bin/retroplug.vst3
            build/bin/retroplug.component
            build/bin/retroplug-vst2.dylib
