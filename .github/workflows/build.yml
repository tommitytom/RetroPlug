name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The dpf.js submodule (and its nested submodules) use SSH URLs; the
          # runner has no SSH key. Init them ourselves after rewriting to HTTPS.
          submodules: false

      - name: Init submodules (rewrite SSH -> HTTPS; all repos are public)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends \
            cmake ninja-build pkg-config \
            libgl-dev libglu1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxext-dev libxinerama-dev \
            libdbus-1-dev libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev \
            libcurl4-openssl-dev libffi-dev libssl-dev \
            libsdl2-dev \
            xvfb

      - name: Install RGBDS (boot-ROM assembler)
        run: |
          set -eux
          tmp="$(mktemp -d)"; cd "$tmp"
          curl -fsSL "https://github.com/gbdev/rgbds/releases/download/v1.0.1/rgbds-linux-x86_64.tar.xz" -o rgbds.tar.xz
          tar -xJf rgbds.tar.xz
          sudo install -m 0755 rgbasm rgblink rgbgfx rgbfix /usr/local/bin/
          rgbasm --version

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install workspace deps (pnpm)
        run: |
          pnpm install --frozen-lockfile
          # The UI bundle's react/react-reconciler/lvgljs-ui live in
          # lv_binding_js's own workspace (deps/ is excluded from the root
          # workspace), so it needs its own install (spec/06-build-test.md, "The dpf.js seam").
          pnpm install --frozen-lockfile -C deps/dpf.js/deps/lv_binding_js

      # Platform-independent, so the x86 linux job alone carries it, and it runs BEFORE the build for
      # fast feedback. cli/sdkSurfaceCheck.ts is compile-only and exists to fail exactly this command
      # when the hand-maintained cli/sdk-types.d.ts drifts from the SDK it describes - until this step
      # existed it had never run in CI, so the check was only as good as a human remembering it.
      - name: Typecheck
        run: pnpm typecheck

      # Dead relative links in the docs are invisible in review - a link renders the same whether or
      # not it resolves - so they only ever surface by misleading a reader. Needs nothing but node and
      # a checkout, so it runs before the build with the other fast feedback.
      - name: Doc links
        run: node tools/check-doc-links.mjs

      - name: Build
        run: ./build.sh

      # The Mesen compile-out proof (docs/modular-graph-phase-f2-design.md section 11): Mesen built with its SNES, PCE
      # and WonderSwan consoles OFF at -O0 in a build directory of its own, the archive then held self-contained. A
      # missed compile-out guard links in the Release build above and fails only here. Its scan reads GNU nm output, so
      # this job alone carries it; the ON mode (every console built in, the CLI linked) stays a by-hand run.
      - name: Mesen compile-out proof (consoles OFF, -O0)
        run: tools/build-mesen-all-consoles.sh --off

      - name: TS tests
        run: pnpm test

      - name: Native tests (real host + emulator cores)
        # This job is the parity baseline's target: exact audio checking must run here, not fall back. It is the kit
        # baselines' target too: test-native's kit-baseline and kit-compile compare exact bank bytes only on the host
        # that recorded them, so this job demands that it is that host rather than falling back to self-agreement. The
        # render baseline (render-baseline, its fixture-free cases here) is held the same way.
        env:
          RP_PARITY_REQUIRE_TARGET: "1"
          RP_KIT_GOLDEN_REQUIRE_TARGET: "1"
          RP_RENDER_GOLDEN_REQUIRE_TARGET: "1"
        run: pnpm test:native

      - name: Plugin unit tests (Catch2)
        run: pnpm test:plugin

      - name: UI tests (headless LVGL)
        run: pnpm test:ui

      # The only gates in CI on the SDL and CLI host bodies. Everything above drives the test host,
      # the UI harness or the plugin; until these ran here, CI proved sdl/main.cpp and cli/main.cpp
      # COMPILED and nothing more, while between them they carry the gamepad pump, the key bus, the
      # close guard, the geometry latch and the whole TS-stripping harness a consumer repo depends on.
      # Neither needs a display server or an audio server: the smoke runs SDL's dummy drivers.
      - name: SDL standalone smoke (dummy video/audio)
        run: pnpm sdl:smoke

      - name: CLI TypeScript harness
        # The render leg compares the CLI's WAV hash to the golden's only on the golden's build target; this job is
        # that target, so a foreign build fails here instead of skipping.
        env:
          RP_RENDER_GOLDEN_REQUIRE_TARGET: "1"
        run: pnpm test:cli-ts

      # retroplug-sdl is in the default `all` target, so the Build step compiles and links it on
      # every platform and it rides along in the artifact below; `pnpm sdl:smoke` above then proves
      # it RUNS, on this job only. It is deliberately absent from release.yml's packaging lists.

      # The device build (docs/modular-graph-phase-e1-design.md section 7): rp-device-check, the RP2350 image that runs
      # every portable node type (and the N8 Edio) in device mode, and a multi-node plan through the plan loader (the
      # E3 design's section 7), linked with a trap on the heap, on exceptions and on RTTI, so a node that allocates or
      # throws on the device fails this step naming the object, and a probe that allocates must fail to link, proving
      # the trap still reaches the link. Built, never run here (the rig runs it by hand). Its plan
      # (packages/graph-runtime/device-check/plan.json) is exported at build time by retroplug-export-plan, which the
      # script builds by name in the desktop build above (it is in no default target). The Pico SDK is pinned to the
      # tag the devcontainer's is, and the check needs none of its submodules; reflect-cpp comes from the desktop build
      # above, at the desktop's pin. x86 linux alone carries it: the image is the same from any host.
      - name: Install the device toolchain (arm-none-eabi, Pico SDK 2.1.1)
        run: |
          set -eux
          sudo apt-get install -yqq --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          arm-none-eabi-g++ --version

      - name: Device build (rp-device-check, the link trap)
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: pnpm device:check

      # The Pico box's firmware (docs/modular-graph-phase-e2-design.md section 8): pico/n8-host, the MIDI-to-N8 bridge
      # on the N8 pack's Edio, in both USB variants, each linked under the same trap over the whole image (TinyUSB and
      # Pico-PIO-USB included), with its own probe that must fail to link. Built, never run (the rig's gate runs it).
      # Its built-in plan (pico/n8-host/plan.json, the E3 design's section 5) is exported at build time by
      # retroplug-export-plan, which the script builds by name in the desktop build above (it is in no default target).
      # It needs what the device check does not: the SDK's TinyUSB submodule (0.18.0, by the 2.1.1 tag's pointer) and
      # Pico-PIO-USB at the commit the rig's firmware was proven on, which nothing else in the repository uses.
      - name: Install the box's USB stacks (TinyUSB, Pico-PIO-USB 5a37a66)
        run: |
          set -eux
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb
          git init -q "$RUNNER_TEMP/Pico-PIO-USB"
          git -C "$RUNNER_TEMP/Pico-PIO-USB" fetch -q --depth 1 https://github.com/sekigon-gonnoc/Pico-PIO-USB.git \
            5a37a66dc5d3fbe0ef3cdbeda923a757440f984f
          git -C "$RUNNER_TEMP/Pico-PIO-USB" checkout -q FETCH_HEAD

      - name: Device build (the Pico box's firmware, the link trap)
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
          PICO_PIO_USB_PATH: ${{ runner.temp }}/Pico-PIO-USB
        run: pnpm device:box

      - name: Install plugin-format validators
        run: |
          set -eux
          tmp="$(mktemp -d)"
          cd "$tmp"
          curl -fsSL "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip" -o pv.zip
          unzip -q pv.zip
          sudo install -m 0755 pluginval /usr/local/bin/pluginval
          curl -fsSL "https://github.com/free-audio/clap-validator/releases/download/0.3.2/clap-validator-0.3.2-ubuntu-18.04.tar.gz" -o cv.tgz
          tar -xzf cv.tgz
          sudo install -m 0755 clap-validator /usr/local/bin/clap-validator
          pluginval --version
          clap-validator --version

      - name: Validate plugins
        run: xvfb-run -a pnpm validate

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retroplug-linux-x86_64
          if-no-files-found: warn
          path: |
            build/bin/retroplug
            build/bin/retroplug-cli
            build/bin/retroplug.clap
            build/bin/retroplug.vst3
            build/bin/retroplug-vst2.so
            build/bin/retroplug-sdl

  # Native arm64 Linux build — the Raspberry Pi target (Pi 3/4/5, Zero 2, on the
  # 64-bit Raspberry Pi OS). Mirrors the `linux` job on a free arm64 runner; the
  # whole tree already builds arm64 (the macOS job ships an arm64 slice), so this
  # is mostly the same recipe with three swaps: the arm64 runner, RGBDS built
  # from source (no arm64 release binary is published), and no plugin validators
  # (pluginval / clap-validator ship x86_64-only Linux builds). The native / ui /
  # plugin suites still run natively and are the real arm64 coverage.
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodules (rewrite SSH -> HTTPS; all repos are public)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends \
            cmake ninja-build pkg-config \
            libgl-dev libglu1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxext-dev libxinerama-dev \
            libdbus-1-dev libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev \
            libcurl4-openssl-dev libffi-dev libssl-dev \
            libsdl2-dev \
            bison libpng-dev

      - name: Install RGBDS (boot-ROM assembler, built from source — no arm64 release)
        run: |
          set -eux
          tmp="$(mktemp -d)"; cd "$tmp"
          git clone --depth 1 --branch v1.0.1 https://github.com/gbdev/rgbds
          cd rgbds
          make -j"$(nproc)"
          sudo install -m 0755 rgbasm rgblink rgbgfx rgbfix /usr/local/bin/
          rgbasm --version

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install workspace deps (pnpm)
        run: |
          pnpm install --frozen-lockfile
          pnpm install --frozen-lockfile -C deps/dpf.js/deps/lv_binding_js

      - name: Build
        run: ./build.sh

      - name: TS tests
        run: pnpm test

      - name: Native tests (real host + emulator cores)
        run: pnpm test:native

      - name: Plugin unit tests (Catch2)
        run: pnpm test:plugin

      - name: UI tests (headless LVGL)
        run: pnpm test:ui

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retroplug-linux-aarch64
          if-no-files-found: warn
          path: |
            build/bin/retroplug
            build/bin/retroplug-cli
            build/bin/retroplug.clap
            build/bin/retroplug.vst3
            build/bin/retroplug-vst2.so
            build/bin/retroplug-sdl

  windows:
    # windows-2025-vs2026: Windows Server 2025 + Visual Studio 2026 (MSVC 14.51), matching the
    # toolset this project is developed on. The plain windows-2022 / windows-2025 images both ship
    # VS 2022 17.14 (MSVC 14.44), which disagrees with 14.51 about which warnings exist -- under
    # the /W4 /WX build that meant a locally clean tree could still fail here (it did, on C4127).
    runs-on: windows-2025-vs2026
    env:
      # build.bat defaults VCPKG_ROOT to C:\code\vcpkg; point it at the runner's
      # preinstalled vcpkg. RGBDS_DIR is set later once RGBDS is extracted.
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodules (rewrite SSH -> HTTPS; all repos are public)
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install workspace deps (pnpm)
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm install --frozen-lockfile -C deps/dpf.js/deps/lv_binding_js

      - name: Install RGBDS (boot-ROM assembler)
        shell: pwsh
        run: |
          $ver = "v1.0.1"
          Invoke-WebRequest "https://github.com/gbdev/rgbds/releases/download/$ver/rgbds-win64.zip" -OutFile rgbds.zip
          Expand-Archive rgbds.zip -DestinationPath "$env:RUNNER_TEMP\rgbds"
          # build.bat prepends %RGBDS_DIR% to PATH so find_program locates rgbasm/rgblink/rgbgfx.
          "RGBDS_DIR=$env:RUNNER_TEMP\rgbds" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache vcpkg installed packages
        uses: actions/cache@v6
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-static-sdl2-libffi-${{ runner.os }}

      - name: Install vcpkg dependencies (x64-windows-static)
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install sdl2:x64-windows-static libffi:x64-windows-static

      - name: Build
        shell: cmd
        run: build.bat

      # test.bat enters the MSVC env itself (GitHub Actions does not persist the
      # env build.bat set up into later steps) and runs the suites via pnpm.
      - name: Test suites (ts / native / plugin / ui)
        shell: cmd
        run: test.bat

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retroplug-windows-x86_64
          if-no-files-found: warn
          path: |
            build/bin/RetroPlug.exe
            build/bin/retroplug-cli.exe
            build/bin/RetroPlug.clap
            build/bin/RetroPlug.vst3
            build/bin/RetroPlug.dll
            build/bin/retroplug-sdl.exe

  # Universal (arm64 + x86_64) macOS build on macos-15. Building both slices on
  # every PR gives x86_64 compile coverage without a native Intel runner (the
  # macos-13 Intel runners are effectively unavailable). Tests run against the
  # native arm64 slice. Matches release.yml's universal recipe: libffi comes
  # from the (universal) macOS SDK — do NOT `brew install libffi` (single-arch,
  # would shadow it); SDL2 comes from the official universal framework.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodules (rewrite SSH -> HTTPS; all repos are public)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install build dependencies (Homebrew)
        run: brew install ninja pkg-config rgbds

      - name: Install universal SDL2.framework
        run: |
          set -eux
          ver="2.32.10"
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-${ver}/SDL2-${ver}.dmg" -o "$tmp/SDL2.dmg"
          hdiutil attach "$tmp/SDL2.dmg" -nobrowse -quiet -mountpoint "$tmp/mnt"
          lipo -info "$tmp/mnt/SDL2.framework/SDL2"
          mkdir -p "$HOME/Library/Frameworks"
          cp -R "$tmp/mnt/SDL2.framework" "$HOME/Library/Frameworks/"
          hdiutil detach "$tmp/mnt" -quiet

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install workspace deps (pnpm)
        run: |
          pnpm install --frozen-lockfile
          pnpm install --frozen-lockfile -C deps/dpf.js/deps/lv_binding_js

      - name: Configure + build (universal)
        run: |
          set -eux
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DRETROPLUG_SDL2_FRAMEWORK=ON
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Verify universal slices
        run: |
          set -eux
          for f in build/bin/RetroPlug.app/Contents/MacOS/RetroPlug \
                   build/bin/retroplug-cli \
                   build/bin/RetroPlug.clap/Contents/MacOS/retroplug \
                   build/bin/RetroPlug.vst3/Contents/MacOS/retroplug \
                   build/bin/RetroPlug.component/Contents/MacOS/retroplug \
                   build/bin/RetroPlug.vst/Contents/MacOS/retroplug \
                   build/bin/retroplug-sdl; do
            lipo -archs "$f" | grep -q x86_64
            lipo -archs "$f" | grep -q arm64
          done

      - name: TS tests
        run: pnpm test

      - name: Native tests (real host + emulator cores)
        run: pnpm test:native

      - name: Plugin unit tests (Catch2)
        run: pnpm test:plugin

      - name: UI tests (headless LVGL)
        run: pnpm test:ui

      # SDL standalone: built by the `all` target above and shipped in the artifact
      # (see the linux job). NOTE it is not usable off this runner — the SDL2.framework
      # embed in packages/native/CMakeLists.txt covers the .app/.vst3/.clap/.component/.vst
      # BUNDLES only, and retroplug-sdl is a bare executable, so it resolves SDL2 through
      # the build machine's absolute rpath. Fine for a build artifact; it needs a framework
      # copy + @executable_path rpath before it could ship. Excluded from release.yml.

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retroplug-macos-universal
          if-no-files-found: warn
          path: |
            build/bin/RetroPlug.app
            build/bin/retroplug-cli
            build/bin/RetroPlug.clap
            build/bin/RetroPlug.vst3
            build/bin/RetroPlug.component
            build/bin/RetroPlug.vst
            build/bin/retroplug-sdl
