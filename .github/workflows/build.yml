name: build

on:
  push:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SDL2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq libsdl2-dev
      - uses: distrho/dpf-cmake-action@v1
        with:
          dpf_path: ./deps/dpf
          target: linux-x86_64

  macos:
    strategy:
      matrix:
        target: [macos-intel, macos-universal]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SDL2.framework (universal)
        run: |
          SDL_VERSION=2.30.10
          curl -fsSL -o /tmp/SDL2.dmg \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.dmg"
          hdiutil attach -nobrowse -mountpoint /Volumes/SDL2 /tmp/SDL2.dmg
          sudo cp -R /Volumes/SDL2/SDL2.framework /Library/Frameworks/
          hdiutil detach /Volumes/SDL2
      - uses: distrho/dpf-cmake-action@v1
        env:
          MACOS_APP_CERTIFICATE: ${{ secrets.MACOS_APP_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARIZATION_USER: ${{ secrets.MACOS_NOTARIZATION_USER }}
          MACOS_NOTARIZATION_PASS: ${{ secrets.MACOS_NOTARIZATION_PASS }}
          MACOS_NOTARIZATION_TEAM: ${{ secrets.MACOS_NOTARIZATION_TEAM }}
        with:
          dpf_path: ./deps/dpf
          target: ${{ matrix.target }}

  pluginval:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SDL2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq libsdl2-dev
      - uses: distrho/dpf-cmake-action@v1
        with:
          dpf_path: ./deps/dpf
          target: pluginval

  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: distrho/dpf-cmake-action@v1
        with:
          dpf_path: ./deps/dpf
          target: source
